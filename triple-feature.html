<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#180B3D">
<meta name="description" content="Triple Feature — a movie-night party game for two to four players on one phone. Charades, emoji plots and buzzer trivia.">
<title>Triple Feature</title>
<style>
:root{
  --ink:#180B3D; --tape:#0B0524; --label:#FFF8E7;
  --stub:#FFD23F; --sticker:#FF2E63; --neon:#FF4FD8; --teal:#00E5FF;
  --lime:#B6FF3C; --orange:#FF8A2B; --purple:#8B5CF6; --dim:#A99BE0;
  --display:"Impact","Haettenschweiler","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--label);font-family:var(--body);min-height:100vh;
  background-image:
    radial-gradient(90vw 60vh at 12% -10%,rgba(255,79,216,.34),transparent 60%),
    radial-gradient(80vw 55vh at 92% 8%,rgba(0,229,255,.26),transparent 62%),
    radial-gradient(70vw 45vh at 50% 105%,rgba(182,255,60,.16),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);
  background-attachment:fixed;
  padding:18px 16px calc(28px + env(safe-area-inset-bottom));line-height:1.5;overflow-x:hidden}
body.alarm{background-color:#5C0A22}
.wrap{max-width:520px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0;text-transform:uppercase}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
button:disabled{opacity:.35;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- marquee title ---------- */
.marquee{text-align:center;margin:8px 0 22px;padding:20px 12px;border-radius:14px;
  background:linear-gradient(160deg,#3B1078,#1B0842);
  box-shadow:0 0 0 4px var(--tape),0 0 0 10px var(--stub),0 14px 40px rgba(255,79,216,.35);position:relative;overflow:hidden}
.marquee:before,.lights:before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:chase .55s steps(2) infinite}
.marquee:before{padding:9px;background:radial-gradient(circle,var(--stub) 2.6px,transparent 3.4px) 0 0/20px 20px}
@keyframes chase{50%{background-position:10px 10px;opacity:.55}}
.marquee .a,.marquee .b{font-family:var(--display);font-size:clamp(42px,15.5vw,80px);line-height:.86;display:block}
.marquee .a{color:var(--stub);text-shadow:3px 3px 0 var(--sticker),6px 6px 0 rgba(0,0,0,.5)}
.marquee .b{color:var(--teal);text-shadow:3px 3px 0 var(--purple),6px 6px 0 rgba(0,0,0,.5)}
.marquee p{color:#E9DFFF;font-size:.85rem;margin:14px 0 0;letter-spacing:.05em;position:relative}

/* ---------- menu tapes ---------- */
.spine{display:block;width:100%;text-align:left;background:linear-gradient(100deg,#150A38,#24104E);
  border-left:16px solid var(--stub);border-radius:6px;padding:16px 18px;margin:0 0 12px;color:var(--label);
  box-shadow:0 6px 0 rgba(0,0,0,.5),0 0 22px rgba(255,210,63,.18);transition:transform .12s,box-shadow .12s}
.spine:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.5)}
.spine.two{border-left-color:var(--neon);box-shadow:0 6px 0 rgba(0,0,0,.5),0 0 22px rgba(255,79,216,.25)}
.spine.three{border-left-color:var(--teal);box-shadow:0 6px 0 rgba(0,0,0,.5),0 0 22px rgba(0,229,255,.25)}
.spine.four{border-left-color:var(--lime);box-shadow:0 6px 0 rgba(0,0,0,.5),0 0 22px rgba(182,255,60,.22)}
.spine .n{font-family:var(--display);font-size:1.6rem;display:block;line-height:1.1}
.spine .d{font-size:.83rem;color:var(--dim);display:block;margin-top:3px}
.spine.sm{padding:11px 14px;border-left-width:10px}.spine.sm .n{font-size:1.2rem}
.sect{font-size:.76rem;letter-spacing:.12em;color:var(--teal);text-transform:uppercase;margin:22px 0 10px;font-weight:700}

/* ---------- cards ---------- */
.card{background:var(--label);color:#170B33;border-radius:10px;padding:22px 20px;
  box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 28px rgba(255,255,255,.08);border-top:6px solid var(--stub)}
.card+.card{margin-top:12px}
.card .kicker{font-size:.76rem;letter-spacing:.1em;color:#7A5BB5;margin:0 0 10px;font-weight:700;text-transform:uppercase}
.card .big{font-family:var(--display);font-size:clamp(28px,8.5vw,44px);line-height:1.02;margin:0}
.card .mid{font-size:1.15rem;margin:0;font-weight:600}
.card p.sub{margin:12px 0 0;font-size:.92rem;color:#5B4A85}
.card.dark{background:linear-gradient(150deg,#1D0B47,#30125C);color:var(--label);border-top-color:var(--teal)}
.card.dark p.sub{color:var(--dim)}
.card.red{background:linear-gradient(150deg,var(--sticker),#B3123F);color:#fff;border-top-color:var(--stub)}
.card.red p.sub{color:#FFE2EA}
.card.gold{background:linear-gradient(150deg,var(--stub),#E5A500);color:#2B1D00;border-top-color:var(--sticker)}
.card.neon{background:linear-gradient(150deg,var(--neon),#B01E96);color:#fff;border-top-color:var(--teal)}

/* emoji plots — one cell per grapheme so ZWJ sequences never split mid-character */
.emoji{display:flex;flex-wrap:wrap;justify-content:center;gap:.06em;margin:8px 0;
  font-size:clamp(46px,14vw,78px);line-height:1.2;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.emoji.raw{display:block;text-align:center;overflow-wrap:anywhere}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;background:linear-gradient(180deg,#FFE066,var(--stub));color:#2B1D00;
  font-family:var(--display);font-size:1.5rem;letter-spacing:.03em;padding:16px;border-radius:8px;
  box-shadow:0 5px 0 #B98800,0 0 22px rgba(255,210,63,.35);margin-top:12px;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #B98800}
.btn.go{background:linear-gradient(180deg,#5CF6FF,var(--teal));color:#00313A;box-shadow:0 5px 0 #0092A8,0 0 22px rgba(0,229,255,.4)}
.btn.go:active{box-shadow:0 1px 0 #0092A8}
.btn.no{background:linear-gradient(180deg,#5B36A8,#3E2178);color:var(--label);font-size:1.15rem;padding:13px;box-shadow:0 5px 0 #24124A}
.btn.no:active{box-shadow:0 1px 0 #24124A}
.btn.red{background:linear-gradient(180deg,#FF5C84,var(--sticker));color:#fff;box-shadow:0 5px 0 #A8123D,0 0 22px rgba(255,46,99,.4)}
.btn.red:active{box-shadow:0 1px 0 #A8123D}
.btn.huge{font-size:2.2rem;padding:28px 16px}
.btn.buzz{font-size:1.7rem;padding:36px 10px;line-height:1.05;border-radius:12px}
.btn.buzz.p1{background:radial-gradient(circle at 50% 30%,#FFE066,#E5A500);color:#2B1D00;box-shadow:0 6px 0 #9E7400,0 0 30px rgba(255,210,63,.5)}
.btn.buzz.p2{background:radial-gradient(circle at 50% 30%,#FF7FE4,#C81FA8);color:#fff;box-shadow:0 6px 0 #8A0F72,0 0 30px rgba(255,79,216,.5)}
.btn.buzz:active{transform:translateY(5px)}
.btn.buzz.long{font-size:1.15rem}
.btn.ghost{background:transparent;color:var(--dim);box-shadow:none;font-family:var(--body);font-size:.86rem;padding:10px;margin-top:14px}
.row{display:flex;gap:10px}.row .btn{flex:1}
.dock{position:sticky;bottom:0;padding:14px 0 calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,transparent,var(--ink) 34%);z-index:4}
.dock .btn{margin-top:0}
.dock.locked .btn{opacity:.4;pointer-events:none}
.dock .hint{text-align:center;font-size:.76rem;color:var(--dim);margin:8px 0 0;letter-spacing:.04em}
.btn.spot{display:block;margin-top:12px;text-align:center;text-decoration:none;
  background:linear-gradient(180deg,#39E07B,#1DB954);color:#04301A;box-shadow:0 5px 0 #11803A,0 0 22px rgba(29,185,84,.45)}
.btn.spot:active{transform:translateY(4px);box-shadow:0 1px 0 #11803A}
.link{background:none;border:0;color:var(--teal);font:inherit;text-decoration:underline;padding:0;cursor:pointer}

/* ---------- scoreboard ---------- */
.score{display:flex;gap:10px;margin-bottom:16px}
.score>div{flex:1;background:linear-gradient(160deg,#1C0A45,#2B1060);border-radius:8px;padding:10px 12px;
  border-bottom:5px solid #3E2178;min-width:0;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.score>div.pl0{border-bottom-color:var(--stub)}
.score>div.pl1{border-bottom-color:var(--neon)}
.score>div.pl0 .pt{color:var(--stub);text-shadow:0 0 16px rgba(255,210,63,.6)}
.score>div.pl1 .pt{color:var(--neon);text-shadow:0 0 16px rgba(255,79,216,.6)}
.score>div.lead{box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 26px rgba(255,255,255,.14)}
.score .nm{font-size:.8rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.score .pt{font-family:var(--display);font-size:2rem;line-height:1}
.score .sub{font-size:.72rem;color:var(--dim)}
.tapes{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:18px}
.tp{font-size:.66rem;font-weight:700;padding:2px 6px;border-radius:3px;background:#3A1E6E;color:var(--label);border-left:4px solid var(--stub);white-space:nowrap}
.night{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:12px;font-size:.74rem;
  color:var(--teal);letter-spacing:.12em;font-weight:700;text-align:center}
.night b{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3E2178;margin:0 2px;vertical-align:middle}
.night b.w0{background:var(--stub);box-shadow:0 0 10px var(--stub)}
.night b.w1{background:var(--neon);box-shadow:0 0 10px var(--neon)}

/* ---------- clocks ---------- */
.clock{font-family:var(--display);font-size:clamp(64px,24vw,110px);text-align:center;line-height:1;color:var(--lime);
  text-shadow:0 0 26px rgba(182,255,60,.55)}
.clock small{display:block;font-family:var(--body);font-size:.8rem;color:var(--dim);letter-spacing:.08em;margin-top:2px;text-shadow:none}
.clock.low{color:var(--sticker);text-shadow:0 0 28px rgba(255,46,99,.7)}
.clock.low b{display:inline-block;animation:pulse 1s infinite}
.clock.hold{color:var(--purple);text-shadow:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.bar{height:12px;background:#2B1060;border-radius:99px;overflow:hidden;margin:10px 0 18px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));transition:width .9s linear;box-shadow:0 0 14px rgba(0,229,255,.7)}
.bar.low i{background:linear-gradient(90deg,var(--orange),var(--sticker));box-shadow:0 0 14px rgba(255,46,99,.8)}

/* ---------- clue stamps ---------- */
.stamp{display:inline-block;font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;padding:6px 12px;border-radius:5px;
  background:var(--sticker);color:#fff;transform:rotate(-2deg);margin:0 6px 14px 0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.stamp.q{background:var(--neon)}.stamp.w{background:var(--purple)}.stamp.h{background:var(--teal);color:#00313A}
.stamp.t{background:var(--orange);color:#2B1D00}.stamp.b{background:#1544B8;color:#fff}
.stamp.x{background:#170B33;color:var(--stub);transform:rotate(2deg)}
.special{margin:14px 0 0;padding:12px;border-radius:6px;font-weight:700;font-size:.98rem;color:#fff;background:var(--purple);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.special.dare{background:var(--sticker)}.special.dbl{background:var(--stub);color:#2B1D00}
.special.death{background:#0B0524;color:var(--sticker)}
.fire{margin-top:10px;text-align:center;font-family:var(--display);font-size:1.35rem;color:var(--orange);letter-spacing:.06em;
  text-shadow:0 0 18px rgba(255,138,43,.7)}

/* progress towards the target, on the clue screen */
.pips{display:flex;justify-content:center;gap:6px;margin-top:10px}
.pips i{width:12px;height:12px;border-radius:50%;background:#3E2178;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.pips i.on{background:var(--lime);box-shadow:0 0 12px rgba(182,255,60,.7)}

/* ---------- tracking glitch on every screen change ---------- */
#app.glitch{animation:tear .3s steps(3) 1}
#app.glitch:before{content:"";position:fixed;inset:0;z-index:7;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px);
  animation:band .3s linear 1}
@keyframes tear{
  0%{transform:translateX(0);filter:none}
  33%{transform:translateX(-7px);filter:drop-shadow(3px 0 0 rgba(255,46,99,.75)) drop-shadow(-3px 0 0 rgba(0,229,255,.75))}
  66%{transform:translateX(5px);filter:drop-shadow(-2px 0 0 rgba(255,79,216,.6))}
  100%{transform:translateX(0);filter:none}
}
@keyframes band{from{opacity:.85;transform:translateY(-14%)}to{opacity:0;transform:translateY(14%)}}

/* ---------- which came first: the two contenders ---------- */
.versus{display:flex;align-items:stretch;gap:10px;margin:6px 0}
.versus .vs{flex:1;min-width:0;background:linear-gradient(150deg,#1D0B47,#30125C);color:var(--label);
  border-radius:8px;padding:16px 12px;text-align:center;border-bottom:5px solid #3E2178;
  display:flex;flex-direction:column;justify-content:center;gap:8px}
.versus .vs .t{font-family:var(--display);font-size:clamp(17px,4.6vw,24px);line-height:1.08}
.versus .vs .y{font-family:var(--display);font-size:1.5rem;color:var(--dim);letter-spacing:.06em}
.versus .vs.older{border-bottom-color:var(--lime);box-shadow:0 0 26px rgba(182,255,60,.3)}
.versus .vs.older .y{color:var(--lime)}
.versus .or{align-self:center;font-family:var(--display);font-size:1.2rem;color:var(--sticker);flex:none}

/* ---------- late fees ---------- */
.fees{background:#1C0A45;border-radius:8px;padding:12px 14px;margin-top:12px;border-left:5px solid var(--sticker)}
.fees .lbl{margin:0 0 8px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.feerow{display:flex;gap:10px}
.fee{flex:1;min-width:0;background:#2B1060;border-radius:6px;padding:8px 10px 9px}
.fee .who{display:block;font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--dim);margin-bottom:6px}
.fee .ctl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.fee b{font-family:var(--display);font-size:1.4rem;color:var(--stub);min-width:1.1em;text-align:center}
.fee button{width:40px;height:38px;flex:none;border-radius:6px;background:#4B2A8A;color:var(--label);
  font-size:1.3rem;line-height:1;font-weight:700}
.fee button:disabled{opacity:.3}

/* ---------- membership card & rental receipt ---------- */
.memcard{margin-top:18px;border-radius:10px;padding:16px 18px 14px;
  background:linear-gradient(135deg,#1544B8,#0B2A7A);box-shadow:0 8px 0 rgba(0,0,0,.45);position:relative;overflow:hidden}
.memcard .strip{position:absolute;left:0;right:0;top:0;height:14px;
  background:repeating-linear-gradient(90deg,var(--stub) 0 18px,#E5A500 18px 36px)}
.memcard .co{margin:12px 0 0;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#A8C4FF;font-weight:700}
.memcard .nm{margin:4px 0 0;font-family:var(--display);font-size:clamp(22px,6vw,38px);color:#fff;line-height:1.05;
  overflow-wrap:anywhere}
.memcard .no{margin:8px 0 0;font-size:.68rem;letter-spacing:.14em;color:#C6D8FF;font-family:ui-monospace,Menlo,Consolas,monospace}
.receipt{margin-top:12px;background:#F6F1E3;color:#2A2118;border-radius:4px;padding:18px 18px 22px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;
  box-shadow:0 8px 0 rgba(0,0,0,.4)}
.receipt .hd{margin:0;text-align:center;font-weight:700;letter-spacing:.2em}
.receipt .hd.sm{font-size:.68rem;letter-spacing:.1em;font-weight:400;color:#6B6052;margin-top:3px}
.receipt .ln{border-top:1px dashed #B5A995;margin:10px 0}
.receipt .li{display:flex;justify-content:space-between;gap:12px;margin:4px 0}
.receipt .li span:last-child{text-align:right;font-weight:700}
.receipt .li.tot{font-size:.95rem;letter-spacing:.04em}
.receipt .ft{margin:10px 0 0;text-align:center;font-size:.72rem;color:#6B6052;line-height:1.6}

/* ---------- hints ---------- */
.hints{margin:14px 0 0;padding:14px;background:#EFE6D2;border-radius:6px;border-left:5px solid var(--purple)}
.hints .h{font-size:.72rem;letter-spacing:.1em;color:#6B4FA8;margin:0 0 6px;text-transform:uppercase;font-weight:700}
.hints ul{margin:0;padding-left:18px;font-size:.95rem}.hints li{margin:3px 0}
.hints ul.acts li{margin:6px 0}
.hints .tip{margin:10px 0 0;font-size:.8rem;color:#6B5B92;font-style:italic}
.hints .humtxt{margin:0;font-size:.95rem}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words span{background:linear-gradient(180deg,#2B1060,#170B33);color:var(--stub);font-family:var(--display);font-size:1.2rem;
  padding:7px 13px;border-radius:5px;letter-spacing:.04em;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.hand{text-align:center;padding:22px 0 8px;font-size:3.4rem;line-height:1;filter:drop-shadow(0 0 20px rgba(0,229,255,.5))}

/* ---------- flash ---------- */
.flash{position:fixed;inset:0;background:var(--sticker);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--display);font-size:clamp(80px,30vw,160px);line-height:1;z-index:9;animation:blink .25s 4;text-align:center;padding:20px}
.flash small{font-family:var(--body);font-size:1.1rem;margin-top:8px}
.flash.gold{background:linear-gradient(160deg,var(--stub),var(--orange));color:#2B1D00}
@keyframes blink{50%{background:#7A0F1F}}

/* ---------- tape graphic ---------- */
.genre{display:flex;align-items:center;gap:14px}
.genre .vhs{width:70px;height:110px;flex:none;background:linear-gradient(150deg,#12072E,#25105A);border-radius:6px;
  border-top:10px solid var(--stub);position:relative;box-shadow:0 5px 0 rgba(0,0,0,.5),0 0 22px rgba(255,255,255,.1)}
.genre .vhs:before{content:"";position:absolute;left:12px;right:12px;top:22px;height:14px;background:var(--label);border-radius:2px}
.genre .vhs:after{content:"";position:absolute;left:14px;right:14px;bottom:14px;height:34px;border:3px solid #4B2A8A;border-radius:5px}

/* ---------- winner ---------- */
.lights{position:relative;padding:28px 14px;border-radius:14px;background:linear-gradient(160deg,#3B1078,#12062F);text-align:center;
  box-shadow:0 0 0 5px var(--tape),0 0 0 12px var(--stub),0 18px 50px rgba(255,79,216,.4);overflow:hidden}
.lights:before{padding:11px;background:radial-gradient(circle,var(--stub) 3px,transparent 4px) 0 0/22px 22px}
/* Team names can be long ("Ada & Bo" vs a 12-character name) — wrap rather than clip. */
.lights .who{font-family:var(--display);font-size:clamp(38px,14vw,92px);line-height:.92;color:var(--stub);
  text-shadow:3px 3px 0 var(--sticker),0 0 40px rgba(255,210,63,.6);
  overflow-wrap:anywhere;word-break:break-word;padding:0 4px}
.lights .w{font-family:var(--display);font-size:clamp(26px,9vw,44px);color:var(--teal);letter-spacing:.08em}
.lights .rec{color:#E9DFFF;font-size:.9rem;margin-top:12px;position:relative}
.confetti{position:fixed;top:-20px;width:11px;height:17px;z-index:8;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}

/* ---------- forms ---------- */
label{display:block;font-size:.85rem;color:var(--dim);margin:18px 0 6px;font-weight:600}
input[type=text]{width:100%;padding:13px;border-radius:6px;border:0;background:#160A38;color:var(--label);font-size:1.05rem;font-family:inherit;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
input[type=text]:focus-visible{outline:3px solid var(--teal)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:1;background:#1C0A45;color:var(--dim);padding:12px 4px;border-radius:6px;font-weight:700;font-size:.9rem;min-width:70px}
.chips button[aria-pressed=true]{background:linear-gradient(180deg,#5CF6FF,var(--teal));color:#00313A;box-shadow:0 0 18px rgba(0,229,255,.45)}
.note{color:var(--dim);font-size:.85rem;margin-top:16px}
.tick{width:100%;display:flex;align-items:center;gap:10px;background:#1C0A45;padding:13px;border-radius:6px;color:var(--label);text-align:left;font-size:.95rem;margin-top:10px}
.tick b{width:22px;height:22px;border-radius:5px;background:#3E2178;flex:none}
.tick[aria-pressed=true] b{background:linear-gradient(180deg,var(--lime),#7ACF16);box-shadow:0 0 14px rgba(182,255,60,.6)}
.got{list-style:none;padding:0;margin:14px 0 0;font-size:.95rem}
.got li{padding:7px 0;border-bottom:1px solid rgba(0,0,0,.12);display:flex;justify-content:space-between;gap:10px}
.got li.miss{color:#8A7AB5}
.got li span{color:#8A7AB5;font-size:.8rem;flex:none}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:10px}
td{padding:6px 0;border-bottom:1px solid rgba(0,0,0,.1)}td:not(:first-child){text-align:right;font-weight:700}

/* ============ WIDE SCREENS: fill a 16:9 desktop instead of a phone strip ============ */
@media (min-width:900px){
  body{padding:26px 28px 34px;display:grid;justify-items:center;align-content:start}
  .wrap{max-width:1180px;width:100%}
  .card{padding:28px 30px;border-radius:14px}
  .card .big{font-size:clamp(34px,3.2vw,58px)}
  .card .mid{font-size:1.3rem}
  .card p.sub{font-size:1.02rem}
  .hints ul,.hints .humtxt{font-size:1.06rem}
  .words span{font-size:1.45rem;padding:9px 16px}
  .btn{font-size:1.7rem;padding:18px}
  .btn.huge{font-size:2.6rem;padding:32px}
  .btn.buzz{font-size:2.1rem;padding:60px 14px}
  .score .pt{font-size:2.6rem}
  .score .nm{font-size:.95rem}
  .clock{font-size:clamp(96px,9vw,168px)}
  .emoji{font-size:clamp(72px,7.5vw,132px)}
  .night{font-size:.85rem}

  /* menu: two columns of tapes */
  body[data-screen="menu"] .wrap{max-width:860px}
  body[data-screen="menu"] .spine.sm{display:inline-block;width:calc(50% - 6px);vertical-align:top}
  body[data-screen="menu"] .spine.sm:nth-of-type(odd){margin-right:8px}

  /* setup & rules stay readable rather than stretched */
  body[data-screen="setup"] .wrap,
  body[data-screen="quick"] .wrap,
  body[data-screen="rules"] .wrap{max-width:760px}
  body[data-screen="rules"] .wrap{column-count:2;column-gap:24px}
  body[data-screen="rules"] .card{break-inside:avoid;margin-bottom:12px}
  body[data-screen="rules"] h2,body[data-screen="rules"] .btn{column-span:all}

  /* the two live screens go side-by-side: controls left, card right */
  body[data-screen="play"] .wrap,
  body[data-screen="buzz"] .wrap{
    display:grid;grid-template-columns:400px minmax(0,1fr);gap:30px;align-items:start}
  body[data-screen="play"] .wrap>*,
  body[data-screen="buzz"] .wrap>*{grid-column:1;min-width:0}
  body[data-screen="play"] .wrap>.card,
  body[data-screen="buzz"] .wrap>.card{grid-column:2;grid-row:1/span 40;margin:0}
  body[data-screen="play"] .dock,
  body[data-screen="buzz"] .dock{position:static;background:none;padding:6px 0 0}
  body[data-screen="play"] .row,
  body[data-screen="buzz"] .row{flex-direction:column}
  body[data-screen="buzz"] .btn.buzz{padding:46px 14px}

  /* result / gameover: list beside the headline */
  body[data-screen="result"] .wrap,
  body[data-screen="gameover"] .wrap{max-width:900px}
  .lights .who{font-size:clamp(70px,7vw,120px)}
}
/* very wide: don't let the card become a billboard */
@media (min-width:1500px){
  body[data-screen="play"] .wrap,
  body[data-screen="buzz"] .wrap{grid-template-columns:440px minmax(0,900px);justify-content:center}
}
/* phone held sideways — short and wide */
@media (max-height:520px) and (min-width:660px){
  body{padding:10px 14px}
  .marquee{padding:10px;margin-bottom:12px}
  .marquee .a,.marquee .b{font-size:clamp(30px,7vw,48px)}
  .clock{font-size:clamp(46px,8vh,70px)}
  .card{padding:14px 16px}
  .btn{font-size:1.2rem;padding:11px}
  .btn.huge{font-size:1.5rem;padding:16px}
  .btn.buzz{padding:22px 10px;font-size:1.3rem}
  .hand{padding:6px 0 4px;font-size:2rem}
  body[data-screen="play"] .wrap,
  body[data-screen="buzz"] .wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start;max-width:none}
  body[data-screen="play"] .wrap>*,
  body[data-screen="buzz"] .wrap>*{grid-column:1;min-width:0}
  body[data-screen="play"] .wrap>.card,
  body[data-screen="buzz"] .wrap>.card{grid-column:2;grid-row:1/span 40}
  body[data-screen="play"] .dock,
  body[data-screen="buzz"] .dock{position:static;background:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  try{

    SAVE_KEYS.forEach(k=>{
      const v=o[k];if(v===undefined||v===null)return;

        if(Array.isArray(v))for(let i=0;i<4;i++)if(typeof v[i]==="string")S.names[i]=v[i].slice(0,12);

const SEGMENTER=(typeof Intl!=="undefined"&&Intl.Segmenter)?new Intl.Segmenter(undefined,{granularity:"grapheme"}):null;
function emojiCells(str){
  if(!SEGMENTER)return `<div class="emoji raw">${esc(str)}</div>`;
  const cells=[...SEGMENTER.segment(str)].map(s=>`<span>${esc(s.segment)}</span>`).join("");
  return `<div class="emoji">${cells}</div>`;
}

function estMins(nightWide){

/* ============ AUDIO (built on first tap so phones allow it) ============ */
function audioInit(){if(S.ac)return;try{const C=window.AudioContext||window.webkitAudioContext;if(C)S.ac=new C()}catch(e){}}
function tone(hz,ms,type="square",vol=.06,when=0){
  if(!S.sound||!S.ac)return;
  try{
    if(S.ac.state==="suspended")S.ac.resume();
    const o=S.ac.createOscillator(),g=S.ac.createGain(),t=S.ac.currentTime+when;
    o.type=type;o.frequency.value=hz;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+ms/1000);
    o.connect(g);g.connect(S.ac.destination);o.start(t);o.stop(t+ms/1000);
  }catch(e){}
}
// A frequency ramp — the backbone of every tape noise below.
function sweep(from,to,ms,type="sawtooth",vol=.07,when=0){
  if(!S.sound||!S.ac)return;
  try{
    if(S.ac.state==="suspended")S.ac.resume();
    const o=S.ac.createOscillator(),g=S.ac.createGain(),t=S.ac.currentTime+when;
    o.type=type;o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t+ms/1000);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+ms/1000);
    o.connect(g);g.connect(S.ac.destination);o.start(t);o.stop(t+ms/1000);
  }catch(e){}
}
// Band-limited white noise: tape hiss, tracking static, the head hitting the drum.
function noise(ms,freq=1800,q=1,vol=.05,when=0){
  if(!S.sound||!S.ac)return;
  try{
    if(S.ac.state==="suspended")S.ac.resume();
    const t=S.ac.currentTime+when,len=Math.max(1,(S.ac.sampleRate*ms/1000)|0);
    const buf=S.ac.createBuffer(1,len,S.ac.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const src=S.ac.createBufferSource();src.buffer=buf;
    const f=S.ac.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;f.Q.value=q;
    const g=S.ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+ms/1000);
    src.connect(f);f.connect(g);g.connect(S.ac.destination);src.start(t);src.stop(t+ms/1000);
  }catch(e){}
}

/* ---- stop the phone dimming mid-round ---- */
async function keepAwake(){
  try{ if(!navigator.wakeLock||S.wl)return;
    S.wl=await navigator.wakeLock.request("screen");
    S.wl.addEventListener("release",()=>{S.wl=null});
  }catch(e){}
}
function releaseAwake(){try{S.wl&&S.wl.release()}catch(e){}S.wl=null}

/* Leaving the app (for Spotify, a call, anything) must not burn the clock. */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){
    if(S.screen==="play"&&!S.prep){S.away=1;clearInterval(S.timer);S.left=Math.max(1,Math.ceil((S.endAt-Date.now())/1000))}
    if(S.screen==="faceoff"){S.awayFo=1;clearInterval(S.foTimer);S.foLeft=Math.max(1,Math.ceil((S.foEnd-Date.now())/1000))}
    if(S.screen==="buzz"&&S.bz&&S.bz.st==="live"){S.awayBz=1;clearInterval(S.bz.timer);S.bz.left=Math.max(1,Math.ceil((S.bz.end-Date.now())/1000))}
    return;
  }
  if(S.away){S.away=0;S.endAt=Date.now()+S.left*1000;runClock();keepAwake();return}
  if(S.awayFo){S.awayFo=0;S.foEnd=Date.now()+S.foLeft*1000;resumeShotClock();keepAwake();render();return}
  if(S.awayBz){S.awayBz=0;S.bz.end=Date.now()+S.bz.left*1000;resumeBuzzClock();keepAwake();render();return}
  render();
});

/* ============ DECKS ============ */
MOVIES.forEach(m=>{if(!m.y)m.y=YEARS[m.t]||0});
const FAM={},GOF={},YOF={};MOVIES.forEach(m=>{FAM[m.t]=m.f;GOF[m.t]=m.g;YOF[m.t]=m.y});
function inPlay(m){
  if(S.family&&!m.f)return false;
  const e=ERAS[S.era]||ERAS[""];
  return m.y>=e.lo&&m.y<=e.hi;
}
// A buzzer card is only playable if its film is in the current slice.
const cardInPlay=a=>{const m={t:a,f:FAM[a],y:YOF[a]};return YOF[a]!==undefined&&inPlay(m)};

function pool(g){
  const shelf=MOVIES.filter(m=>inPlay(m)&&(!g||m.g===g));
  if(shelf.length>=MIN_SHELF)return shelf;
  const any=MOVIES.filter(inPlay);
  return any.length>=MIN_SHELF?any:MOVIES.filter(m=>!S.family||m.f);
}
function availableGenres(){
  return Object.keys(GENRES).filter(g=>MOVIES.filter(m=>m.g===g&&inPlay(m)).length>=MIN_SHELF);
}
function buildDeck(g){S.deck=shuffle(pool(g));S.di=0}
function nextMovie(){
  if(S.di>=S.deck.length){
    const last=S.deck[S.deck.length-1];
    S.deck=shuffle(S.deck);S.di=0;
    // don't let a reshuffle deal the same title twice in a row
    if(S.deck.length>1&&S.deck[0]===last)[S.deck[0],S.deck[1]]=[S.deck[1],S.deck[0]];
  }
  S.cur=S.deck[S.di++];
  S.clue=pickClue();
  S.special=null;S.dare=null;
  if(S.mystery&&Math.random()<.18)S.special=pick(SPECIALS);
  else if(S.dares&&Math.random()<.28)S.dare=pick(DARES);
}
// Weighted so charades stays the backbone and the retro framings are a
// garnish rather than half the deck.
function pickClue(){
  const canHum=S.hum&&HUMSET.has(S.cur.t)&&(!S.music||SONG[S.cur.t]);
  const opts=CLUES.filter(c=>(c.uses!=="h"||canHum)&&(!c.retro||S.retro));
  let roll=Math.random()*opts.reduce((n,c)=>n+c.wt,0);
  for(const c of opts){roll-=c.wt;if(roll<=0)return c}
  return opts[0];
}

function snapshot(){return{cur:S.cur,clue:S.clue,special:S.special,dare:S.dare,score:S.score,streak:S.streak,
  got:S.got.slice(),missed:S.missed.slice(),gots:S.stats.gots.slice(),passes:S.stats.passes.slice(),best:S.stats.best.slice()}}
function undoCard(){
  const u=S.undo;if(!u)return;
  S.cur=u.cur;S.clue=u.clue;S.special=u.special;S.dare=u.dare;S.score=u.score;S.streak=u.streak;
  S.got=u.got;S.missed=u.missed;S.stats.gots=u.gots;S.stats.passes=u.passes;S.stats.best=u.best;
  S.undo=null;tone(420,90,"triangle",.05);pauseClock();lockTaps();render();
}
function swapCard(){
  if(!S.swaps)return;
  S.swaps--;tone(560,90,"triangle",.05);
  const was=S.cur;let guard=0;
  do{nextMovie();guard++}while(S.cur===was&&guard<5);
  S.undo=null;lockTaps();render();
}
// A short dead zone after every card stops a double-tap scoring twice.
function lockTaps(){S.lock=1;clearTimeout(S.lockT);S.lockT=setTimeout(()=>{S.lock=0;render()},500)}

/* ============ RENDER ============ */
const V={};
function go(s){S.screen=s;render()}
function overlay(html){$("#overlay").innerHTML=html}

function nightBar(){
  if(!S.night.on)return "";
  const dots=[0,1,2].map(i=>`<b class="${S.night.won[i]!==undefined?'w'+S.night.won[i]:''}"></b>`).join("");
  return `<div class="night">GAME ${S.night.g} · BEST OF 3 · ${gameAt(S.night.g).n.toUpperCase()} ${dots}</div>`;
}
function scoreboard(sc,sub){
  const box=i=>`<div class="pl${i} ${sc[i]>sc[1-i]?'lead':''}">
    <div class="nm">${esc(S.p[i])}</div><div class="pt">${sc[i]}</div>
    ${sub?sub(i):``}
    ${S.night.on||S.booze?`<div class="sub">${S.night.on?plural(S.night.wins[i],"game"):""}${S.night.on&&S.booze?" · ":""}${S.booze?plural(S.fees[i],"fee"):""}</div>`:``}</div>`;
  return `<div class="score">${box(0)}${box(1)}</div>`;
}

/* ---- late fees: one fee = one shot. The game adds one for a lost game;
   this panel is how the table adds the rest. Only shown between rounds. ---- */
function feeBar(){
  if(!S.booze)return "";
  const side=i=>`<div class="fee">
      <span class="who">${esc(S.p[i])}</span>
      <span class="ctl">
        <button data-unfee="${i}" ${S.fees[i]?"":"disabled"} aria-label="Remove a late fee from ${esc(S.p[i])}">−</button>
        <b>${S.fees[i]}</b>
        <button data-fee="${i}" aria-label="Add a late fee for ${esc(S.p[i])}">+</button>
      </span>
    </div>`;
  return `<div class="fees"><p class="lbl">Late fees · one shot each</p>
    <div class="feerow">${side(0)}${side(1)}</div></div>`;
}
const feeTotal=()=>S.fees[0]+S.fees[1];
const tapeSub=i=>`<div class="tapes">${S.tapes[i].map(g=>`<span class="tp" style="border-left-color:var(${GCOL[g]})">${GENRES[g]}</span>`).join("")}</div>`;

function clock(left,total,label,hold){
  const low=!hold&&left<=5, pct=Math.max(0,left/total*100);
  return `<div class="clock ${low?'low':''} ${hold?'hold':''}" id="clk" role="timer" aria-live="off">
    <b id="clkNum">${left}</b><small id="clkLbl">${label}</small></div>
  <div class="bar ${low?'low':''}" id="clkBar"><i style="width:${pct}%"></i></div>`;
}
// Timers repaint just the digits and the bar. Re-rendering the whole screen
// once a second used to rebuild the card, drop keyboard focus and make the
// buttons briefly un-tappable.
function paintClock(left,total,label,hold){
  const c=$("#clk");if(!c){render();return}
  const low=!hold&&left<=5;
  $("#clkNum").textContent=left;
  if(label!==undefined)$("#clkLbl").textContent=label;
  c.classList.toggle("low",low);c.classList.toggle("hold",!!hold);
  const bar=$("#clkBar");bar.classList.toggle("low",low);
  bar.firstElementChild.style.width=Math.max(0,left/total*100)+"%";
}

V.play=()=>{
  const sp=S.special,dare=S.dare,death=sp&&sp.k==="death";
  const pips=S.mode==="full"
    ? `<div class="pips" aria-label="${S.score} of ${S.need} correct">${Array.from({length:S.need},(_,i)=>`<i class="${i<S.score?'on':''}"></i>`).join("")}</div>`
    : ``;
  return `
${clock(S.left,S.total,S.prep?"clock paused — read your card":"seconds left",S.prep)}
<div class="card">
  <span class="stamp ${S.clue.c}">${S.clue.c==="h"&&S.music&&SONG[S.cur.t]?"Play it":esc(S.clue.k)}</span>${sp?`<span class="stamp x">${esc(sp.n)}</span>`:``}
  <h2 class="big">${esc(S.cur.t)}</h2>
  <p class="sub">${esc(S.clue.r)}</p>
  ${hintBlock()}
  ${sp?`<p class="special ${sp.k}">${esc(sp.n)} — ${esc(sp.r)}</p>`:``}
  ${dare?`<p class="special dare">Wildcard — ${esc(dare)}</p>`:``}
</div>
${S.streak>=3?`<div class="fire">On fire — ${S.streak} in a row</div>`:``}
${pips}
<p class="note">${S.mode==="full"?`Correct: ${S.score} of ${S.need} · ${esc(actor(S.giver))} performing`:`Correct: ${S.score}`}</p>
<div class="dock ${S.lock?"locked":""}">
  <div class="row">
    <button class="btn no" data-act="pass" ${death?"disabled":""}>Pass</button>
    ${S.prep?`<button class="btn go" data-act="startcard">Start ▶</button>`
            :`<button class="btn go" data-act="got">Got it${sp&&sp.k==="dbl"?" ×2":""}</button>`}
  </div>
  <p class="hint">${S.prep
    ? [`Read your card, then Start`,
       S.swaps?`<button class="link" data-act="swap">haven't seen it — swap (${S.swaps})</button>`:``,
       S.undo?`<button class="link" data-act="undo">undo last</button>`:``].filter(Boolean).join(" · ")
    : `Space = Got it`}</p>
</div>`;
};

V.buzz=()=>{
  const z=S.bz,it=z.items[z.i],mode=S.game;
  const shown=z.st!=="live";
  const kicker={emoji:"Emoji plot",trivia:"Plot twist",years:"Which came first?"}[mode];

  let body,answer="";
  if(mode==="emoji"){
    body=emojiCells(it.e);
    if(shown)answer=`<h2 class="big" style="margin-top:14px;color:#C8106A">${esc(it.a)}</h2>`;
  }else if(mode==="trivia"){
    body=`<p class="mid" style="font-size:1.25rem;line-height:1.35">${esc(it.q)}</p>`;
    if(shown)answer=`<h2 class="big" style="margin-top:14px;color:#C8106A">${esc(it.a)}</h2>`;
  }else{
    const face=(m,i)=>`<div class="vs${shown&&it.a===i?" older":""}">
        <span class="t">${esc(m.t)}</span>${shown?`<span class="y">${m.y}</span>`:`<span class="y">????</span>`}</div>`;
    body=`<div class="versus">${face(it.pair[0],0)}<span class="or">vs</span>${face(it.pair[1],1)}</div>`;
    if(shown)answer=`<p class="sub"><b>${esc(it.pair[it.a].t)}</b> came first — by ${Math.abs(it.pair[0].y-it.pair[1].y)} years.</p>`;
  }

  let controls="";
  if(z.st==="live")controls=`<div class="dock"><div class="row">
      <button class="btn buzz p1 ${S.n>2?'long':''}" data-buzz="0">${esc(S.p[0])}<br>BUZZ</button>
      <button class="btn buzz p2 ${S.n>2?'long':''}" data-buzz="1">${esc(S.p[1])}<br>BUZZ</button></div>
      <p class="hint">Keyboard: 1 and 2</p></div>`;
  else if(z.st==="pick")controls=`
      <div class="card ${z.who?'neon':'gold'}"><p class="kicker" style="color:inherit;opacity:.75">${esc(S.p[z.who])} buzzed in</p>
      <h2 class="big">Which one came first?</h2></div>
      <div class="dock"><div class="row">
        <button class="btn go" data-pick="0">${esc(it.pair[0].t)}</button>
        <button class="btn go" data-pick="1">${esc(it.pair[1].t)}</button>
      </div><p class="hint">Keyboard: 1 and 2</p></div>`;
  else if(z.st==="buzzed")controls=`
      <div class="card ${z.who?'neon':'gold'}"><p class="kicker" style="color:inherit;opacity:.75">${esc(S.p[z.who])} buzzed in</p>
      <h2 class="big">Did ${esc(S.p[z.who])} say it?</h2>
      <p class="sub" style="color:inherit;opacity:.8">${esc(S.p[1-z.who])} decides. Close enough counts. No steals — next question either way.</p></div>
      <div class="dock"><div class="row">
        <button class="btn red" data-rule="0">No — next</button>
        <button class="btn go" data-rule="1">Yes — point to ${esc(S.p[z.who])}</button>
      </div></div>`;
  else controls=`<div class="dock"><button class="btn go" data-act="bznext">${raceDone()?"Final score":"Next question"}</button></div>`;

  const canHint=mode!=="years";
  return `
${nightBar()}${scoreboard(z.sc)}
${clock(z.st==="live"?z.left:0,S.buzz,z.st==="live"?"to buzz":"buzzed in",z.st!=="live")}
<div class="card">
  <p class="kicker">${kicker} ${z.i+1}</p>
  ${body}
  ${answer}
  ${z.msg?`<p class="sub">${esc(z.msg)}</p>`:``}
  ${z.st==="live"&&z.hint&&canHint?`<p class="sub"><b>Shelf: ${GENRES[GOF[it.a]]||"Mixed"}</b></p>`:``}
</div>
${z.st==="live"&&!z.hint&&canHint?`<button class="btn ghost" data-act="ghint">Stuck? Show the genre</button>`:``}
${controls}${quitBtn()}`;
};

/* A re-render replaces the screen wholesale, so remember where the keyboard
   was and put it back — otherwise every toggle on the setup screen throws
   focus to the top of the page. */
function focusKey(el){
  if(!el||el===document.body||!el.dataset)return null;
  const d=el.dataset,set=el.parentElement&&el.parentElement.dataset.set;
  if(d.tog)return `[data-tog="${d.tog}"]`;
  if(set&&d.v!==undefined)return `[data-set="${set}"] [data-v="${d.v}"]`;
  if(d.act)return `[data-act="${d.act}"]`;
  if(el.id)return "#"+el.id;
  return null;
}
let glitchT=null;
function render(){
  const moved=S.screen!==S._last;S._last=S.screen;
  const active=document.activeElement;
  const key=moved?null:focusKey(active);
  const caret=(active&&active.tagName==="INPUT")?active.selectionStart:null;
  document.body.dataset.screen=S.screen;
  const app=$("#app");
  app.innerHTML=(V[S.screen]||V.menu)();
  if(moved){
    window.scrollTo(0,0);
    trackingSfx();
    if(!calmMotion()){
      app.classList.remove("glitch");void app.offsetWidth;app.classList.add("glitch");
      clearTimeout(glitchT);glitchT=setTimeout(()=>app.classList.remove("glitch"),300);
    }
    return;
  }
  if(!key)return;
  let back=null;try{back=$("#app "+key)}catch(e){}
  if(!back)return;
  back.focus({preventScroll:true});
  if(caret!==null&&back.setSelectionRange)try{back.setSelectionRange(caret,caret)}catch(e){}
}

/* ============ FLOW ============ */
// flashSeq invalidates a pending flash when the player quits mid-animation,
// so a stale callback can't drag them back into a game they just left.
let flashT=null,flashSeq=0;
function flash(big,small,then,ms=1500,gold){
  const seq=++flashSeq;
  if(!gold)document.body.classList.add("alarm");
  overlay(`<div class="flash ${gold?'gold':''}" role="status">${esc(big)}<small>${esc(small)}</small></div>`);
  clearTimeout(flashT);
  flashT=setTimeout(()=>{
    if(seq!==flashSeq)return;
    document.body.classList.remove("alarm");overlay("");
    if(then)then();
  },ms);
}
function cancelFlash(){flashSeq++;clearTimeout(flashT);flashT=null;document.body.classList.remove("alarm");overlay("")}

function stopTimers(){
  clearInterval(S.timer);clearInterval(S.foTimer);clearTimeout(S.lockT);S.lock=0;
  S.away=S.awayFo=S.awayBz=0;
  if(S.bz)clearInterval(S.bz.timer);
  cancelFlash();
  document.querySelectorAll(".confetti").forEach(e=>e.remove());
}
function toMenu(){stopTimers();releaseAwake();S.quitArm=0;S.night.on=0;go("menu")}

function readNames(){
  for(let i=0;i<4;i++){const el=$("#n"+i);if(el)S.names[i]=el.value.trim().slice(0,12)||("Player "+(i+1))}
  syncP();saveSettings();
}
// Keeps whatever is typed (including a half-finished name) across a re-render.
function keepNames(){for(let i=0;i<4;i++){const el=$("#n"+i);if(el)S.names[i]=el.value}syncP()}

function startNight(){
  S.night={on:1,g:1,wins:[0,0],won:[],correct:[0,0],lineup:["tapes","emoji",S.third]};
  S.fees=[0,0];S.game=S.night.lineup[0];go("gameintro");
}
const gameAt=n=>gameById(S.night.on?S.night.lineup[n-1]:S.game);
function beginGame(){
  if(S.game==="tapes"){resetTapes();startRound();return}
  if(S.game==="years"){startBuzz(yearPairs());return}
  let set=(S.game==="emoji"?EMOJI:TRIVIA).filter(x=>cardInPlay(x.a));
  if(set.length<12)set=(S.game==="emoji"?EMOJI:TRIVIA).filter(x=>!S.family||FAM[x.a]);
  startBuzz(set);
}
// Pairs far enough apart in time that "which came first" is knowledge, not luck.
function yearPairs(){
  const films=shuffle(MOVIES.filter(m=>inPlay(m)&&m.y));
  const out=[];
  for(let i=0;i<films.length;i++)for(let j=i+1;j<films.length&&out.length<400;j++){
    if(Math.abs(films[i].y-films[j].y)>=YEAR_GAP){out.push({pair:[films[i],films[j]],a:films[i].y<films[j].y?0:1});break}
  }
  return shuffle(out);
}
function finishGame(w){
  S.gw=w;releaseAwake();
  if(S.night.on){S.night.wins[w]++;S.night.won.push(w)}
  if(S.booze)S.fees[1-w]++;                       // the loss costs a fee, as it always did
  fanfare();vib([200,80,200]);
  flash(S.p[w],"takes the game",()=>go("gameover"),1400,1);
}

/* ---- tape race ---- */
function tapesDone(){return S.sc[0]>=S.target||S.sc[1]>=S.target}
const needFor=sec=>Math.max(3,Math.round(sec/7));
function resetTapes(){
  S.mi=[0,0];S.sc=[0,0];S.tapes=[[],[]];S.round=0;
  S.foTurn=S.night.on?(S.night.g%2?0:1):0;
  S.need=needFor(S.secs);
  S.stats={gots:[0,0],passes:[0,0],best:[0,0],fo:[0,0]};
}
function startRound(){
  S.round++;S.bonus=0;S.lt=null;S.need=needFor(S.secs);
  const taken=S.tapes[0].concat(S.tapes[1]);
  let gs=availableGenres().filter(g=>!taken.includes(g));
  if(!gs.length)gs=availableGenres();
  S.genre=pick(gs);
  if(S.lightning&&S.round%3===0){S.lt=pick(LIGHTNING);S.faceoff=S.lt.p(pick(pool(S.genre)).t);S.foRule=S.lt.r}
  else{S.faceoff=pick(FACEOFFS);S.foRule="Take turns out loud. No repeats. Tap when you've said one."}
  go("category");
}
function startShotClock(){S.foLeft=S.shot;S.foEnd=Date.now()+S.shot*1000;go("faceoff");resumeShotClock()}
function resumeShotClock(){
  clearInterval(S.foTimer);keepAwake();
  S.foTimer=setInterval(()=>{
    const n=Math.max(0,Math.ceil((S.foEnd-Date.now())/1000));
    if(n===S.foLeft)return;
    S.foLeft=n;
    if(n<=5&&n>0)tick();
    if(n<=0){clearInterval(S.foTimer);faceoffLose(S.foTurn);return}
    paintClock(n,S.shot);
  },120);
}
function faceoffLose(loser){
  clearInterval(S.foTimer);buzzer();vib([300,100,300]);
  const w=1-loser;
  S.giver=w;S.stats.fo[w]++;S.bonus=S.lt?15:0;
  const behind=S.sc[1-w]-S.sc[w];
  if(S.comeback&&behind>0)S.bonus+=10*behind;
  S.foTurn=loser;
  flash("BUZZ",`${S.p[loser]} is out. ${S.p[w]} gives the clues.`,()=>go("intro"));
}
function startClock(total,after){
  S.got=[];S.missed=[];S.score=0;S.streak=0;S.qbest=0;
  S.total=total;S.left=total;S.endAt=0;S.after=after;S.prep=1;S.undo=null;
  S.swaps=S.freeswap?2:0;
  nextMovie();lockTaps();go("play");
}
function runClock(){
  clearInterval(S.timer);S.prep=0;tone(700,60);keepAwake();
  if(!S.away)S.endAt=Date.now()+S.left*1000;
  S.timer=setInterval(()=>{
    const n=Math.max(0,Math.ceil((S.endAt-Date.now())/1000));
    if(n===S.left)return;
    S.left=n;
    if(n<=5&&n>0)tick();
    if(n<=0){
      clearInterval(S.timer);releaseAwake();buzzer();vib([400,100,400,100,600]);
      flash("TIME",`${S.score} correct`,S.after,1600);return;
    }
    paintClock(n,S.total);
  },120);
  render();
}
function pauseClock(){clearInterval(S.timer);if(S.endAt)S.left=Math.max(0,Math.ceil((S.endAt-Date.now())/1000));S.prep=1}
function gotIt(){
  S.undo=snapshot();
  const worth=S.special&&S.special.k==="dbl"?2:1;
  S.got.push(S.cur.t+(worth===2?" (×2)":""));
  S.score+=worth;S.streak++;S.qbest=Math.max(S.qbest,S.streak);
  if(S.mode==="full"){
    S.stats.gots[S.giver]+=worth;
    S.stats.best[S.giver]=Math.max(S.stats.best[S.giver],S.streak);
    if(S.night.on)S.night.correct[S.giver]+=worth;
  }
  if(S.streak===3)fanfare();else ding();
  pauseClock();nextMovie();lockTaps();render();
}
function passIt(){
  S.undo=snapshot();
  S.missed.push(S.cur.t);S.streak=0;
  if(S.mode==="full")S.stats.passes[S.giver]++;
  tone(300,120,"triangle",.05);pauseClock();nextMovie();lockTaps();render();
}
function endRound(){
  const win=S.score>=S.need,gainer=win?S.giver:1-S.giver;
  S.sc[gainer]++;
  if(!S.tapes[gainer].includes(S.genre))S.tapes[gainer].push(S.genre);
  S.mi[S.giver]++;
  if(win)fanfare();
  go("result");
}

/* ---- buzzer engine (emoji + trivia) ---- */
function raceDone(){return S.bz.sc[0]>=S.race||S.bz.sc[1]>=S.race}
function startBuzz(items){
  S.bz={items:shuffle(items),i:0,sc:[0,0],st:"live",who:0,left:S.buzz,timer:null,end:0,msg:"",hint:0};
  runBuzzClock();go("buzz");
}
function runBuzzClock(){const z=S.bz;z.left=S.buzz;z.end=Date.now()+S.buzz*1000;resumeBuzzClock()}
function resumeBuzzClock(){
  const z=S.bz;clearInterval(z.timer);keepAwake();
  z.timer=setInterval(()=>{
    const n=Math.max(0,Math.ceil((z.end-Date.now())/1000));
    if(n===z.left)return;
    z.left=n;
    if(n<=3&&n>0)tick();
    if(n<=0){clearInterval(z.timer);buzzer();vib([300]);z.st="reveal";z.msg="Nobody buzzed in time.";render();return}
    paintClock(n,S.buzz);
  },120);
}
function buzzPress(i){
  const z=S.bz;if(!z||z.st!=="live")return;
  clearInterval(z.timer);buzzIn(i);vib([80]);
  // Emoji and Plot Twist are judged by the other player; Which Came First? has
  // a right answer, so the buzzer picks and the app rules.
  z.st=S.game==="years"?"pick":"buzzed";
  z.who=i;z.msg="";render();
}
function rule(right){
  const z=S.bz;
  if(right){z.sc[z.who]++;if(S.night.on)S.night.correct[z.who]++;ding();vib([60])}else wrong();
  if(raceDone()){z.st="reveal";z.msg=right?`Point to ${S.p[z.who]}.`:"No point.";render();return}
  buzzNext();
}
// Which Came First? — the buzzer picks one of the two films.
function pickYear(choice){
  const z=S.bz;if(!z||z.st!=="pick")return;
  const it=z.items[z.i],right=choice===it.a;
  if(right){z.sc[z.who]++;if(S.night.on)S.night.correct[z.who]++;ding();vib([60])}else{wrong();vib([200])}
  z.st="reveal";
  z.msg=right?`${S.p[z.who]} got it.`:`No — ${S.p[z.who]} had it the wrong way round.`;
  render();
}
function buzzNext(){
  const z=S.bz;
  if(raceDone()){finishGame(z.sc[0]>=S.race?0:1);return}
  z.i++;
  if(z.i>=z.items.length){z.items=shuffle(z.items);z.i=0}
  z.st="live";z.msg="";z.hint=0;runBuzzClock();render();
}

/* ---- celebration ---- */
function confetti(){
  if(calmMotion())return;
  const cols=["#FFD23F","#FF2E63","#FF4FD8","#00E5FF","#B6FF3C","#FF8A2B"];
  for(let i=0;i<70;i++){
    const d=document.createElement("div");d.className="confetti";
    d.style.left=Math.random()*100+"vw";d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.5+Math.random()*2.5)+"s";
    d.style.animationDelay=(Math.random()*1.5)+"s";
    d.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),7000);
  }
}

/* ============ INPUT ============ */
// Buzzers fire on pointerdown so the race is decided by the finger, not by the
// browser's click delay. The click that follows is a no-op: buzzPress bails
// once the question is no longer live.
document.addEventListener("pointerdown",e=>{
  if(e.button)return;                              // primary button / any touch only
  const b=e.target.closest("button[data-buzz]");
  if(!b)return;
  audioInit();buzzPress(+b.dataset.buzz);
});

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  audioInit();
  if(b.dataset.go){
    stopTimers();releaseAwake();S.quitArm=0;
    if(b.dataset.go==="menu")S.night.on=0;
    go(b.dataset.go);return;
  }
  if(b.dataset.single){S.night.on=0;S.game=b.dataset.single;go("setup");return}
  if(b.dataset.tog){S[b.dataset.tog]=S[b.dataset.tog]?0:1;keepNames();saveSettings();render();return}
  const set=b.parentElement&&b.parentElement.dataset.set;
  if(set){
    const v=b.dataset.v;
    if(set==="len"){S.len=v;Object.entries(LEN[v]).forEach(([k,x])=>{if(k!=="n")S[k]=x})}
    else{
      S[set]=(v===""||isNaN(+v))?v:+v;
      if(["target","secs","shot","race","buzz"].includes(set))S.len="custom";
    }
    keepNames();saveSettings();render();return;
  }
  if(b.dataset.buzz!==undefined)return;            // handled on pointerdown
  if(b.dataset.rule!==undefined){rule(+b.dataset.rule);return}
  if(b.dataset.pick!==undefined){pickYear(+b.dataset.pick);return}
  if(b.dataset.fee!==undefined){S.fees[+b.dataset.fee]++;ejectSfx();vib([40]);render();return}
  if(b.dataset.unfee!==undefined){const i=+b.dataset.unfee;if(S.fees[i])S.fees[i]--;tone(420,70,"triangle",.05);render();return}

  switch(b.dataset.act){
    case "night":S.night={on:1,g:0,wins:[0,0],won:[],correct:[0,0],lineup:["tapes","emoji",S.third]};go("setup");break;
    case "start":readNames();if(S.night.on)startNight();else{S.fees=[0,0];beginGame()}break;
    case "begin":dialupSfx();beginGame();break;
    case "faceoff":startShotClock();break;
    case "handoff":S.foTurn=1-S.foTurn;S.foLeft=S.shot;S.foEnd=Date.now()+S.shot*1000;tone(700,60);render();break;
    case "stuck":faceoffLose(S.foTurn);break;
    case "play":S.mode="full";buildDeck(S.genre);startClock(S.secs+S.bonus,endRound);break;
    case "got":if(!S.lock)gotIt();break;
    case "startcard":if(!S.lock)runClock();break;
    case "pass":if(!S.lock)passIt();break;
    case "next":tapesDone()?finishGame(S.sc[0]>S.sc[1]?0:1):startRound();break;
    case "bznext":buzzNext();break;
    case "ghint":S.bz.hint=1;tone(520,70);render();break;
    case "nextgame":
      if(S.night.g>=3||Math.max(...S.night.wins)>=2){anthem();confetti();go("champion")}
      else{S.night.g++;S.game=S.night.lineup[S.night.g-1];go("gameintro")}
      break;
    case "again":rewindSfx();beginGame();break;
    case "rematch":stopTimers();rewindSfx();startNight();break;
    case "quit":
      if(S.quitArm){toMenu()}
      else{
        S.quitArm=1;const at=S.screen;render();
        setTimeout(()=>{if(S.quitArm&&S.screen===at){S.quitArm=0;render()}},4000);
      }
      break;
    case "undo":undoCard();break;
    case "swap":if(!S.lock)swapCard();break;
    case "quickstart":S.mode="quick";S.giver=0;buildDeck(S.qgenre||null);startClock(S.secs,()=>go("quickresult"));break;
  }
});

document.addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  audioInit();
  const hit=sel=>{const b=$(sel);if(b&&!b.disabled){e.preventDefault();b.click();return true}return false};
  if(S.screen==="buzz"&&S.bz){
    // Only the two buzzer keys on this screen: a stray space must never award
    // a point on the "did they say it?" card. These call buzzPress directly —
    // the buttons listen for pointerdown, which a synthetic click never fires.
    if(S.bz.st==="live"){
      if(e.key==="1"||e.key==="2"){e.preventDefault();buzzPress(e.key==="1"?0:1);return}
    }
    // Which Came First? — the same two keys now choose between the two films.
    if(S.bz.st==="pick"){
      if(e.key==="1"||e.key==="2"){e.preventDefault();pickYear(e.key==="1"?0:1);return}
    }
    if(S.bz.st==="reveal"&&(e.key===" "||e.key==="Enter"))hit('[data-act="bznext"]');
    return;
  }
  if(e.key===" "||e.key==="Enter"){
    // querySelector with a comma returns document order, not preference order,
    // so try the dock's primary button first and fall back explicitly.
    if(!hit(".dock .btn.go"))hit(".btn.go");
    return;
  }
  if(e.key==="Backspace"&&S.screen==="play"&&S.prep&&S.undo)hit('[data-act="undo"]');
});

loadSettings();
syncP();
render();
</script>
